<div class="tab-pane-content animated-fade-in">

  <!-- Welcome Hero Card Banner -->
  <div class="welcome-hero-banner rounded-4 p-3 p-md-4 mb-3 text-white shadow border-0 position-relative overflow-hidden"
       style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
    
    <!-- Decorative geometric absolute circles -->
    <div class="hero-bg-circle circle-1"></div>
    <div class="hero-bg-circle circle-2"></div>

    <div class="row align-items-center position-relative" style="z-index: 2;">
      <div class="col-12 col-lg-5 text-center text-lg-start mb-2 mb-lg-0">
        <h4 class="fw-extrabold text-white mb-1 leading-tight">Olá, {{ studentName }}!</h4>
        <p class="text-light-muted mb-0" style="font-size: 0.85rem;">
          Seja bem-vindo de volta ao Painel do Aluno Theos (PAN).
        </p>
        <div class="mt-2 d-flex flex-wrap gap-2 justify-content-center justify-content-lg-start">
          <button class="btn btn-sm btn-outline-light fw-bold shadow-sm px-3 py-1.5 rounded-3 d-flex align-items-center gap-2"
                  (click)="setActiveTab('certificates')">
            <i class="fas fa-certificate"></i> Ver Certificados
          </button>
        </div>
      </div>
      <div class="col-12 col-lg-7 d-flex flex-column flex-sm-row justify-content-center justify-content-lg-end align-items-center gap-3">
        
        <!-- Explore Button -->
        <div class="hero-quick-card bg-blur rounded-3 p-2 px-3 border border-white border-opacity-10 d-flex align-items-center gap-3 text-start shadow-sm"
             style="cursor: pointer; max-width: 250px; flex: 1;"
             (click)="setActiveTab('/courses')">
          <div *ngIf="!isLoadingPage" class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center shadow"
               style="width: 40px; height: 40px; flex-shrink: 0;">
            <i class="fas fa-search fs-6 text-primary" style="margin-left: 2px;"></i>
          </div>
          <div *ngIf="!isLoadingPage" style="min-width: 0;">
            <div class="text-uppercase fw-bold text-light-muted"
                 style="font-size: 0.6rem; letter-spacing: 0.05rem;">
              Explore
            </div>
            <div class="fw-bold text-white mb-0 mt-1 text-truncate" style="font-size: 0.8rem;" title="Acessar Todos os Cursos">
              Acessar Todos os Cursos
            </div>
          </div>
        </div>

        <!-- Continue Button -->
        <div class="hero-quick-card bg-blur rounded-3 p-2 px-3 border border-white border-opacity-10 d-flex align-items-center gap-3 text-start shadow-sm" 
             [ngClass]="{'skeleton': isLoadingPage}" 
             [style.cursor]="homeData?.myLatestLesson ? 'pointer' : 'default'"
             (click)="goToLatestLesson()"
             style="max-width: 250px; flex: 1;">
          <div *ngIf="!isLoadingPage" class="rounded-circle bg-dark text-white d-flex align-items-center justify-content-center shadow"
               style="width: 40px; height: 40px; flex-shrink: 0;">
            <i class="fas fa-play fs-6 text-indigo" style="margin-left: 2px;"></i>
          </div>
          <div *ngIf="!isLoadingPage" style="min-width: 0;">
            <div class="text-uppercase fw-bold text-light-muted"
                 style="font-size: 0.6rem; letter-spacing: 0.05rem;">
              Continue de onde parou
            </div>
            <div class="fw-bold text-white mb-0 mt-1 text-truncate" style="font-size: 0.8rem;" [title]="homeData?.myLatestLesson?.lessonTitle || 'Nenhuma aula iniciada'">
              {{ homeData?.myLatestLesson?.lessonTitle || 'Nenhuma aula iniciada' }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Responsive Dashboard Stats Cards -->
  <app-dashboard (tabChange)="setActiveTab($event)" [isLoadingPage]="isLoadingPage" [latestCourse]="homeData?.latestCourse || null" [coursesSummary]="homeData?.myCoursesSummary || null"></app-dashboard>

  <!-- Responsive Blog External Component -->
  <app-blog-external [isLoadingPage]="isLoadingPage" [news]="homeData?.latestNews || []"></app-blog-external>
</div>
