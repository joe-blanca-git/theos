version: '3.8'

services:
  # Banco de Dados MySQL
  mysql_banco:
    image: mysql:8.0
    container_name: theos-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-senha}
      MYSQL_DATABASE: theos_bd
    ports:
      - "3307:3306"
    volumes:
      - theos_db_data:/var/lib/mysql
    networks:
      - theos-network
    restart: always

  # 1. Theos Admin API (POPT) - Porta 5012
  theos-admin-api:
    build:
      context: .
      dockerfile: Theos.Admin.Api/Dockerfile
    container_name: theos-admin-api-container
    ports:
      - "5012:8080"
    env_file:
      - .env
    depends_on:
      - mysql_banco
    networks:
      - theos-network
    restart: always

  # 2. Theos API (PAT) - Porta 5011
  theos-api:
    build:
      context: .
      dockerfile: Theos.Api/Dockerfile
    container_name: theos-api-container
    ports:
      - "5011:8080"
    env_file:
      - .env
    depends_on:
      - mysql_banco
    networks:
      - theos-network
    restart: always

  # 3. Theos Landing API - Porta 5013
  theos-landing-api:
    build:
      context: .
      dockerfile: Theos.Landing.Api/Dockerfile
    container_name: theos-landing-api-container
    ports:
      - "5013:8080"
    env_file:
      - .env
    depends_on:
      - mysql_banco
    networks:
      - theos-network
    restart: always

networks:
  theos-network:
    driver: bridge

volumes:
  theos_db_data:
