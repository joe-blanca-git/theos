<div class="card w-100" style="background-color: rgba(129, 129, 129, 0.288);">
    <div class="card-header text-danger h2">
        Entrar
    </div>
    <div class="card-body text-light">
        <form [formGroup]="loginForm">
            <div class="row form">
                <div class="col-12">
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary">E-mail</label>
                        <input type="email" class="form-control" formControlName="email" id="email" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>
                <div class="col-12">
                    <div class="mb-3">
                        <label for="password" class="form-label text-secondary">Senha</label>
                        <input type="password" class="form-control" formControlName="password" id="password" placeholder="Sua senha" required>
                    </div>
                </div>

                <div class="col-12">
                    <div class="d-grid">
                        <button type="button" class="btn btn-danger" (click)="onLogin()">Entrar</button>
                    </div>
                </div>
            </div>
        </form>
        <div class="row mt-2 ">
            <div class="col-12">
                <div class="mt-3 text-center">
                    <a href="#" class="text-danger text-decoration-none">Esqueceu a senha?</a>
                </div>
            </div>
            <!-- <div class="col-12 d-flex justify-content-center align-items-center mt-5">
                <div class="text-center">
                    <p class="text-secondary mb-2">Não tem uma conta?</p>
                    <a href="#" class="btn btn-danger">Cadastrar-se como Professor</a>
                </div>
            </div> -->
        </div>
    </div>
</div>
