<div class="card w-100" style="background-color: rgba(129, 129, 129, 0.288)">
  <div class="card-header text-danger h2">Entrar</div>
  <div class="card-body text-light">
    <form [formGroup]="loginForm">
      <div class="row form">
        <div class="col-12">
          <div class="mb-3">
            <label for="email" class="form-label text-secondary">E-mail</label>
            <input
              [readOnly]="loading"
              type="email"
              class="form-control"
              formControlName="email"
              id="email"
              placeholder="seuemail@exemplo.com"
              required
            />
          </div>
        </div>
        <div class="col-12">
          <div class="mb-3 position-relative">
  <label for="password" class="form-label text-secondary">Senha</label>

  <input
    [readOnly]="loading"
    [type]="showPassword ? 'text' : 'password'"
    class="form-control pe-5"
    formControlName="password"
    id="password"
    placeholder="Sua senha"
    required
  />

  <button
    type="button"
    class="btn btn-link position-absolute top-50 end-0 mt-3 translate-middle-y text-secondary"
    (click)="togglePassword()"
    tabindex="-1"
  >
    <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
  </button>
</div>

        </div>

        <div class="col-12" *ngIf="!loading; else loadingData">
          <div class="d-grid">
            <button
              [disabled]="loading"
              type="button"
              class="btn btn-danger"
              (click)="onLogin()"
            >
              Entrar
            </button>
          </div>
        </div>
      </div>
    </form>
    <div class="row mt-2">
      <div class="col-12">
        <div class="mt-3 text-center">
          <a
            href="#"
            class="text-danger text-decoration-none"
            routerLink="/auth/recovery-password"
            >Esqueceu a senha?</a
          >
        </div>
      </div>
      <div class="col-12 d-flex justify-content-center align-items-center mt-5">
        <div class="text-center">
          <p class="text-danger mb-2">Não tem uma conta?</p>
          <button routerLink="/landing/register" class="btn btn-danger">
            Cadastrar-se
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #loadingData>
  <div class="col-12 text-center text-danger">
    <div class="spinner-border" role="status"></div>
    <br />
    <span>Entrando</span>
  </div>
</ng-template>
