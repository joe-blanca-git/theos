<div class="card w-100" style="background-color: rgba(129, 129, 129, 0.288)">
  <div class="card-header">
    <span class="text-danger h2">Recuperar Senha</span>
    <p class="text-light">
      Informe seu E-mail cadastrado e vamos te enviar um link para recuperação
      de Senha!
    </p>
  </div>
  <div class="card-body text-light">
    <div class="row">
      <div class="col-12">
        <form [formGroup]="recoveryForm">
          <div class="row form">
            <div class="col-12">
              <div class="mb-1">
                <label for="email" class="form-label text-secondary"
                  >E-mail</label
                >
                <input
                  [disabled]="loading"
                  type="email"
                  class="form-control"
                  formControlName="email"
                  id="email"
                  placeholder="seuemail@exemplo.com"
                  required
                />
              </div>
            </div>
            <div class="col-12 text-center text-danger" *ngIf="loading">
              <div class="spinner-border" role="status"></div>
              <br />
              <span>Enviando E-mail para Recuperação de Senha</span>
            </div>
          </div>
        </form>
      </div>
      <div class="col-12 d-flex justify-content-center align-items-center mt-2">
        <div class="text-center">
          <button
            [disabled]="loading"
            (click)="onRecovery()"
            class="btn btn-danger"
          >
            Enviar
          </button>
        </div>
      </div>
      <div class="col-12 mt-5 text-end">
        <div class="mt-3 text-center">
          <a
            href="#"
            class="text-danger text-decoration-none"
            routerLink="/auth/login"
            >Voltar para o login</a
          >
        </div>
      </div>
    </div>
  </div>
</div>
