<div class="data"  *ngIf="!isLoadingData else loadingData">
    <div class="row">
        <div class="col-12">
            <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <button class="nav-link active" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-home" type="button" role="tab" aria-controls="nav-home" aria-selected="true">
                    Curso
                </button>
                <button class="nav-link" id="nav-profile-tab" data-bs-toggle="tab" data-bs-target="#nav-profile" type="button" role="tab" aria-controls="nav-profile" aria-selected="false">
                    Módulos
                </button>
                <button class="nav-link" id="nav-contact-tab" data-bs-toggle="tab" data-bs-target="#nav-contact" type="button" role="tab" aria-controls="nav-contact" aria-selected="false">
                    Aulas
                </button>
            </div>
            </nav>
            <div class="tab-content" id="nav-tabContent">
            <div class="tab-pane fade show active p-4 position-relative" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab">
                <div class="row">
                    <div class="col-12 d-flex align-items-center justify-content-end">
                        <button class="btn" [ngClass]="{'btn-secondary': !dataCourse, 'btn-success': dataCourse}" [disabled]="!dataCourse">Salvar Alterações</button>
                    </div>
                    <div class="col-12">
                        <app-form-course></app-form-course>
                    </div>
                </div>
            </div>
            <div class="tab-pane fade p-4" id="nav-profile" role="tabpanel" aria-labelledby="nav-profile-tab">
                <!-- <app-form-module></app-form-module> -->
            </div>
            <div class="tab-pane fade p-4" id="nav-contact" role="tabpanel" aria-labelledby="nav-contact-tab">
                <!-- <app-form-leasson></app-form-leasson> -->
            </div>
            </div>
        </div>
    </div>
</div>

<ng-template #loadingData>
    <div class="h-50 text-danger h3 mt-5 d-flex justify-content-center align-items-center flex-column">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <span>Carregando</span>
    </div>
</ng-template>
