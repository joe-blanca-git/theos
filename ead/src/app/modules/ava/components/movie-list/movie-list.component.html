<div class="row mt-2 flex-nowrap overflow-x-auto pb-3">
  <div class="col-9 col-sm-7 col-md-5 col-lg-3" *ngFor="let course of listCourses">
    <div class="card card-horizontal bg-black shadow text-light">
      <img [src]="course.Poster" class="card-img-left" alt="..." />
      <div class="card-body">
        <div class="title">{{ course.Title }}</div>
        <div class="info">
          <div class="year">{{ course.Year }}</div>
          <div class="duration">
            {{ secondsToMinutes(course.DurationSeconds) }} Min
          </div>
          <div class="categorie">{{ course.Category }}</div>
        </div>
        <div class="rate">
          <nz-rate [ngModel]="course.Rate" [disabled]="true"></nz-rate>
        </div>
        <div class="description-small">
          {{ course.DescriptionSmall }}
        </div>
        <div
          class="btn btn-outline-danger btn-sm d-flex gap-2 justify-content-center align-items-center mt-3"
          (click)="selectCourse(course.CourseId)"
        >
          <i class="fa fa-play" aria-hidden="true"></i>
          <span class="small">Estudar Agora</span>
        </div>
      </div>
    </div>
  </div>
</div>
