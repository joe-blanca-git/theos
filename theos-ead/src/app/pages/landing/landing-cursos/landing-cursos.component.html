<div
    *ngIf="loading"
    class="d-flex justify-content-center align-items-center"
    style="height: 100vh"
>
    <div class="row">
        <div class="col-12 d-flex justify-content-center">
        <img
            src="https://i.imgur.com/ISvbhQp.png"
            alt="Loading..."
            class="img-fluid animate-grow"
            style="width: 50px; height: 50px; "
        />
        </div>
        <div class="col-12 mt-5 d-flex justify-content-center">
        <span class="text-danger"><strong>Carregando...</strong></span>
        </div>
    </div>
</div>

  <div *ngIf="!loading" class="container-nav bg-wall" id="landing-page">
    <a href="#landing-page" class="back-to-top page-scroll">Voltar para o Ínicio</a>
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-black-tr">
      <div class="container-fluid">
        <a class="navbar-brand" href="#"><img src="../../../../assets/img/logo/logo-ico.png" width="50" alt=""></a>
        <button 
          class="navbar-toggler" 
          type="button" 
          (click)="toggleMenu()" 
          aria-controls="navbarNavDropdown" 
          aria-expanded="false" 
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" routerLink="/home"><span class="h6"><strong>HOME</strong></span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/professores"><span class="h6"><strong>PROFESSORES</strong></span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" routerLink="/cursos"><span class="h6"><strong>CURSOS</strong></span></a>
            </li>
            <hr class="text-light">
            <li class="nav-item">
              <button class="nav-link btn btn-sm btn-danger text-light" routerLink="/login"><span class=""><strong>ENTRAR</strong></span></button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header id="header" class="ex-header view-sm" style="padding-top: 70px; padding-bottom: 0px;">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <img src="../../../../assets/img/cursos/header.png" class="img-fluid" alt="">
                </div>
            </div> 
        </div>
    </header>

    <div class="mt-4">
      <div class="row mt-4">
        <div class="col-12 text-center">
          <hr class="text-light">
          <span class="h5 text-light">CURSOS</span>
        </div>
        <div class="col-12">
          <div class="row d-flex justify-content-center">
            <div *ngFor="let card of listCursos; let i = index" class="col-auto mt-5 d-flex justify-content-center">      
              <a>
                <div class="movie-card-list" style="z-index: 99;">
                  <div style="z-index: 9999;" class="content-card" [ngClass]="{'move-up': isCardMovedUp[i]}" (click)="toggleMove(i, 'show')">
                    <img [src]="card.UrlImgHeader" alt="Poster">
                    <span class="shadow"></span>
                    <div class="content">
                      <h1 class="text-white text-uppercase">{{ card.Titulo }}</h1>
                      <span class="text-white">{{ card.DataInc ? (card.DataInc | date: 'dd/MM/yyyy') : '' }} - {{ card.Origem }} -</span>
                      <b>&nbsp;&nbsp;{{formatDuration(card.Duracao)}}h</b>
                      <div class="stars">
                        <div class="row">
                          <div class="col-6">
                            <ng-container *ngFor="let star of [0, 1, 2, 3, 4]; let i = index">
                              <span class="fa fa-star" [ngClass]="{'checked': i < card.Avaliacao}"></span>
                            </ng-container>
                          </div>
                          <div class="col-6 text-right">
                            <span class="fa-solid fa-comment fa-xl mr-3" (click)="toggleMove(i, 'comment')"></span>
                            <span class="fa-solid fa-share-nodes fa-xl mr-3" (click)="toggleMove(i, 'share')"></span>
                          </div>
                        </div>
                      </div>
                      <div class="hex-tag">
                        <div *ngFor="let tag of card.tags" class="tag">
                          {{ tag }}
                        </div>
                      </div>
                      <i class="fa fa-angle-up" ></i>
                    </div>
                  </div>                
                  <div style="z-index: 999 !important;" routerLink="../curso-detalhe" [queryParams]="{curso:card.Id}" class="watch-card-info">
                    <button >Estudar Agora</button>
                  </div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
      <div class="copyright">
          <div class="container">
              <div class="row">
                  <div class="col-lg-12">
                      <p class="p-small">Desenvolvido por <a href="" target="_blank">Bit System</a></p>
                  </div>
              </div>
          </div>
      </div>
</div>
