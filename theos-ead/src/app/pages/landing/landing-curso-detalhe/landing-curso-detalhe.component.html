<div
  *ngIf="loading"
  class="d-flex justify-content-center align-items-center"
  style="height: 100vh"
>
  <div class="row">
    <div class="col-12 d-flex justify-content-center">
      <img
        src="https://i.imgur.com/ISvbhQp.png"
        alt="Loading..."
        class="img-fluid animate-grow"
        style="width: 50px; height: 50px"
      />
    </div>
    <div class="col-12 mt-5 d-flex justify-content-center">
      <span class="text-danger"><strong>Carregando...</strong></span>
    </div>
  </div>
</div>

<div *ngIf="!loading" class="container-nav bg-wall" id="landing-page">
  <a href="#landing-page" class="back-to-top page-scroll"
    >Voltar para o Ínicio</a
  >
  <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-black-tr">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><img src="../../../../assets/img/logo/logo-ico.png" width="50" alt=""></a>
      <button 
        class="navbar-toggler" 
        type="button" 
        (click)="toggleMenu()" 
        aria-controls="navbarNavDropdown" 
        aria-expanded="false" 
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home"><span class="h6"><strong>HOME</strong></span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/professores"><span class="h6"><strong>PROFESSORES</strong></span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" routerLink="/cursos"><span class="h6"><strong>CURSOS</strong></span></a>
          </li>
          <hr class="text-light">
          <li class="nav-item">
            <button class="nav-link btn btn-sm btn-danger text-light" routerLink="/login"><span class=""><strong>ENTRAR</strong></span></button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="bg-black pt-3h-100">
    <div class="bg-black pt-3h-100">
      <div class="top mt-5 p-4">
        <div class="columns">
          <div class="column is-full featured_wrapper p-0">
            <img [src]="listAulas[0].UrlHeaderView" class="featured" />
            <div class="title_wrapper h-100 w-50">
              <h1 class="title is-1 has-text-white text-danger">
                {{ listAulas[0]?.Titulo }}
              </h1>
              <span class="has-text-white text-light">{{
                listAulas[0]?.Descricao
              }}</span
              ><br />
              <button class="btn btn-outline-danger mt-5">
                Estudar Agora
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="container-wrapper custom-scrollbar mt-2 mb-5 p-4">
        <div class="row flex-nowrap custom-row">
          <div
            class="col-xl-3 col-md-4 col-sm-6 col-12"
            *ngFor="let card of listAulas[0]?.Aulas"
          >
            <img
              class="image-card-aula border border-dark"
              [src]="card.UrlImg"
              alt=""
            />
          </div>
        </div>
      </div>
    </div>
  </div>


</div>
