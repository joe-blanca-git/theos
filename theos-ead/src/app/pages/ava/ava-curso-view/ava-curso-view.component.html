<div
  class="container  bg-dark p-3 text-center"
  *ngIf="!authenticateAluno()"
>
  <span class="h1 text-danger"
    >ACESSO NÃO AUTORIZADO &nbsp;&nbsp;&nbsp;<i class="fa-solid fa-ban"></i
  ></span>
</div>
<div class="container bg-dark pt p-3 mt-1" *ngIf="authenticateAluno()">
  <div class="row">
    <div class="col-lg-8">
      <div class="video-container mb-4">
        <div *ngIf="avisoVideo" class="d-flex justify-content-center text-center p-5 m-5">
          <span class="text-light"><i class="fa-solid fa-triangle-exclamation text-danger"></i><span class="text-danger">&nbsp;&nbsp;ATENÇÃO</span><br>Vídeo indisponível no momento!</span>
        </div>
        <div *ngIf="loading && !avisoVideo" class="loading-overlay">
          <div class="loading-content">
            <img
                src="https://i.imgur.com/ISvbhQp.png"
                alt="Loading..."
                class="loading-logo"
            />
            <span class="loading-text">Carregando...</span>
          </div>
        </div>
        <div *ngIf="!loading && !avisoVideo" id="iframeVideo"></div>
        <div>
          <div class="bg-black ">
            <img class="img-logo-video rounded-3 bg-dark p-3" src="https://res.cloudinary.com/dez4evjlq/image/upload/v1725367808/logo-ico_ahch5r.png" alt="">
          </div>
        </div> 
      </div>
      <h2 class="mb-3 text-danger">{{ Titulo }}</h2>
      <p class="mb-4 text-light text-justify hidden-sm">{{ DescSm }}</p>
    </div>
    <div class="col-lg-4">
      <h3 class="mb-3 text-danger hidden-sm">Aulas</h3>
      <ul class="list-group">
        <li
          class="list-group-item playlist-item bg-black text-light "
          *ngFor="let item of playlistAula"
          (click)="loadVideo(item.IdVideo)"
          [ngClass]="{'active': item.Active}
          ">
          <div class="d-flex w-100 justify-content-between">
            <h6 class="mb-1 text-danger">{{ item.Titulo }}</h6>
            <small>Duração: <span class="text-secondary">{{formatDuration(item.Duracao)}}</span></small>
          </div>
            <small>
              <p [ngClass]="item.StatusView === 'V' ? 'text-success' : 'text-light'" class="mb-1">
                <i [ngClass]="item.StatusView === 'V' ? 'fa-check-circle text-success' : 'fa-eye-slash text-text-secondary'" class="fa-solid"></i>
                {{ item.DescSm }}
              </p>
          </small>
        </li>
      </ul>
      <div class="mt-3 d-flex justify-content-end">
        <button *ngIf="Finish" class="btn btn-success w-100" (click)="finishLesson()"><i class="fa-solid fa-check-square"></i> Concluir Módulo</button>
      </div>
    </div>
  </div>
</div>
<app-ava-avalia  [status]="visibleAvalia" (statusChange)="visibleAvalia = $event"></app-ava-avalia>
